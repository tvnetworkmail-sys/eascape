<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'">
<title>EASCape</title>
<link rel="stylesheet" href="chrome.css">
</head>
<body>
  <header id="titlebar">
    <img class="app-icon" src="assets/icons/logo_16.png" alt="">
    <span id="title">EASCape</span>
    <div class="drag-fill"></div>
    <div id="toolbar"></div>
    <div class="window-buttons">
      <button data-win="minimize" title="Minimize" aria-label="Minimize"><svg viewBox="0 0 10 10"><path d="M0 5h10" /></svg></button>
      <button data-win="maximize" title="Maximize" aria-label="Maximize" id="max-btn"><svg viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9" /></svg></button>
      <button data-win="close" class="close" title="Close" aria-label="Close"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" /></svg></button>
    </div>
  </header>
  <div id="body">
    <div id="game-space"></div>
    <section id="panel" aria-live="polite"></section>
    <nav id="tabs" aria-label="Sidebar"></nav>
  </div>
  <div id="menu" class="popup" hidden></div>
  <script src="components.js"></script>
  <script src="panels/info.js"></script>
  <script src="panels/config.js"></script>
  <script src="panels/worldhopper.js"></script>
  <script src="panels/devtools.js"></script>
  <script src="panels/questhelper.js"></script>
  <script src="panels/xptracker.js"></script>
  <script src="panels/infoboxes.js"></script>
  <script src="panels/loottracker.js"></script>
  <script src="chrome.js"></script>
</body>
</html>
