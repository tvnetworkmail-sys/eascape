name: Build and release

# Builds the Windows app on every push to main and publishes it on the Releases page,
# as release v<version from package.json>. Bumping "version" in package.json makes a new
# release; pushing again without a bump updates that release's download.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Patches each world's live client.js and checks every hook is found. Doesn't hold up the
  # release (Lost City being briefly down shouldn't), but a failure here means a hook missed.
  live-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Patch the live clients
        shell: bash
        run: |
          for w in 2 3 5 7; do
            curl -fsSL --retry 3 -o "client-w$w.js" "https://w$w-2004.lostcity.rs/client/client.js"
            echo "== world $w ($(sha1sum < client-w$w.js | cut -c1-12))"
            LIVE_BUNDLE="client-w$w.js" node test/patcher.test.js
            LIVE_BUNDLE="client-w$w.js" node test/drawdistance.test.js
          done

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm test
      - run: npx electron-builder --win --x64 --publish never

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: LostLite ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/LostLite-*-setup.exe
            dist/LostLite-*-setup.exe.blockmap
            dist/latest.yml
            dist/LostLite-*-windows.zip
          fail_on_unmatched_files: true
          body: |
            **Windows installer (recommended):** download `LostLite-${{ steps.ver.outputs.version }}-setup.exe` and run it. It installs for your user only (no admin needed), adds desktop and Start menu shortcuts, and updates itself from now on.

            **Portable:** `LostLite-${{ steps.ver.outputs.version }}-windows.zip` - unzip and run `LostLite.exe`. Doesn't update itself.

            If SmartScreen warns (the app isn't code-signed yet): More info, then Run anyway.
