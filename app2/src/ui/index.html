<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'">
<title>2006RS-2</title>
<link rel="stylesheet" href="chrome.css">
</head>
<body>
  <header id="titlebar">
    <img class="app-icon" src="assets/icons/logo_16.png" alt="">
    <span id="title">2006RS-2</span>
    <div id="toolbar"></div>
    <div class="window-buttons">
      <button data-win="minimize" aria-label="Minimize"><svg viewBox="0 0 33 23"><rect x="11" y="11" width="10" height="1" fill="currentColor"/></svg></button>
      <button data-win="maximize" aria-label="Maximize" id="max-btn"></button>
      <button data-win="close" class="close" aria-label="Close"><svg viewBox="0 0 33 23" style="shape-rendering:auto"><path d="M11.5 6.5l9 9M11.5 15.5l9-9" stroke="currentColor" stroke-width="1" fill="none"/></svg></button>
    </div>
  </header>
  <div id="body">
    <div id="game-space"></div>
    <div id="sidebar">
      <section id="panel" aria-live="polite"></section>
      <nav id="tabs" aria-label="Sidebar"></nav>
    </div>
  </div>
  <script src="components.js"></script>
  <script src="panels/info.js"></script>
  <script src="panels/config.js"></script>
  <script src="panels/worldhopper.js"></script>
  <script src="panels/devtools.js"></script>
  <script src="panels/questhelper.js"></script>
  <script src="panels/xptracker.js"></script>
  <script src="panels/loottracker.js"></script>
  <script src="panels/timetracking.js"></script>
  <script src="panels/notes.js"></script>
  <script src="panels/screenmarkers.js"></script>
  <script src="panels/skillcalculator.js"></script>
  <script src="chrome.js"></script>
</body>
</html>
