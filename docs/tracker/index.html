<style>
/* Layout: one column ledger, grouped by month, two tick columns pinned right */
:root{--bg:#f3efe6;--panel:#fbf8f1;--fg:#2a241b;--muted:#7a6e5c;--line:#ddd3c0;--accent:#8a5a14;--added:#3f6f2a;--tested:#2b5f86;
--display:"Cinzel",Georgia,serif;--body:"Source Sans 3",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1813;--panel:#24201a;--fg:#ece4d4;--muted:#a89a82;--line:#3a3328;--accent:#d9a24a;--added:#8cc46d;--tested:#7fb6e0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1813;--panel:#24201a;--fg:#ece4d4;--muted:#a89a82;--line:#3a3328;--accent:#d9a24a;--added:#8cc46d;--tested:#7fb6e0;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:820px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--display);font-size:clamp(24px,5vw,34px);margin:0;letter-spacing:.02em;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 18px}
.stats{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;margin-bottom:12px;font-variant-numeric:tabular-nums}
.stat b{font-family:var(--mono);font-size:18px}
.stat.a b{color:var(--added)}.stat.t b{color:var(--tested)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;display:flex;margin-bottom:6px}
.bar i{display:block;height:100%}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 6px}
.filters button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:4px 10px;border-radius:999px;cursor:pointer}
.filters button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.status{font-size:13px;color:var(--muted);min-height:1.2em}
.month{font-family:var(--display);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:22px 0 4px;display:flex;justify-content:space-between;align-items:end}
.month span{font-family:var(--body);font-size:11px;letter-spacing:.1em;color:var(--muted);display:flex;gap:18px}
.month span em{font-style:normal;width:46px;text-align:center}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.d{font-family:var(--mono);font-size:12px;color:var(--muted);width:44px;flex:none;font-variant-numeric:tabular-nums}
.t{flex:1;min-width:0}
.t a{color:var(--fg);text-decoration:none;border-bottom:1px dotted var(--muted)}
.t a:hover,.t a:focus-visible{color:var(--accent);border-color:var(--accent)}
.cb{display:flex;gap:18px;flex:none}
.cb label{width:46px;display:flex;justify-content:center;cursor:pointer}
.cb input{width:20px;height:20px;cursor:pointer;margin:0}
.cb .ad input{accent-color:var(--added)}.cb .te input{accent-color:var(--tested)}
li.done .t a{color:var(--muted)}
li{flex-wrap:wrap}
.nt{flex-basis:100%;display:flex;gap:8px;align-items:flex-start;padding-left:56px}
.nt span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tested);padding-top:6px;flex:none}
.nt textarea{flex:1;min-width:0;font:inherit;font-size:14px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px;resize:vertical;min-height:32px;field-sizing:content}
.nt textarea::placeholder{color:var(--muted)}
.nt textarea:focus-visible{outline:2px solid var(--tested);outline-offset:1px}
.nt .sv{font-size:12px;color:var(--muted);padding-top:7px;flex:none;min-width:40px}
@media (max-width:440px){.nt{padding-left:0}}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:440px){.cb{gap:6px}.cb label,.month span em{width:38px}.d{width:38px}}
</style>

const state={};let db=null,filter='all';
const $=id=>document.getElementById(id);
function fmtMonth(d){return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{month:'long',year:'numeric'})}
function render(){
  let na=0,nt=0;UPDATES.forEach(u=>{const s=state[u.id]||{};if(s.added)na++;if(s.tested)nt++});
  $('na').textContent=na;$('nt').textContent=nt;
  $('ba').style.width=(100*na/UPDATES.length)+'%';$('bt').style.width=(100*nt/UPDATES.length)+'%';
  const list=$('list');list.textContent='';let curM='',ul=null;
  UPDATES.forEach(u=>{
    const s=state[u.id]||{};
    if(filter==='notadded'&&s.added)return;
    if(filter==='untested'&&(!s.added||s.tested))return;
    if(filter==='done'&&!(s.added&&s.tested))return;
    const m=u.date.slice(0,7);
    if(m!==curM){curM=m;const h=document.createElement('div');h.className='month';h.innerHTML='<div></div><span><em>Added</em><em>Tested</em></span>';h.firstChild.textContent=fmtMonth(u.date);list.appendChild(h);ul=document.createElement('ul');list.appendChild(ul)}
    const li=document.createElement('li');if(s.added&&s.tested)li.className='done';
    const d=document.createElement('div');d.className='d';d.textContent=new Date(u.date+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});
    const t=document.createElement('div');t.className='t';const a=document.createElement('a');a.href=u.url;a.target='_blank';a.rel='noopener';a.textContent=u.title;t.appendChild(a);
    const cb=document.createElement('div');cb.className='cb';
    for(const [k,cls,lab] of [['added','ad','Added'],['tested','te','Tested']]){
      const l=document.createElement('label');l.className=cls;const i=document.createElement('input');i.type='checkbox';i.id=k+'-'+u.id;i.checked=!!s[k];i.setAttribute('aria-label',lab+': '+u.title);i.disabled=!db;
      i.addEventListener('change',()=>save(u.id,k,i.checked));l.appendChild(i);cb.appendChild(l)}
    const nt=document.createElement('div');nt.className='nt';const nl=document.createElement('span');nl.textContent='Notes';
    const ta=document.createElement('textarea');ta.rows=1;ta.value=s.notes||'';ta.placeholder='Testing notes…';ta.disabled=!db;ta.setAttribute('aria-label','Testing notes: '+u.title);ta.dataset.id=u.id;
    const sv=document.createElement('span');sv.className='sv';
    let tm=null;ta.addEventListener('input',()=>{sv.textContent='…';clearTimeout(tm);tm=setTimeout(()=>saveNote(u.id,ta.value,sv),700)});
    ta.addEventListener('blur',()=>{clearTimeout(tm);if((state[u.id]||{}).notes!==ta.value)saveNote(u.id,ta.value,sv);if(dirty)setTimeout(()=>{if(!editing()){dirty=false;render()}},0)});
    nt.append(nl,ta,sv);
    li.append(d,t,cb,nt);ul.appendChild(li)});
  if(!list.children.length){const p=document.createElement('p');p.className='status';p.textContent='Nothing matches this filter.';list.appendChild(p)}
}
const pending={};let dirty=false;
const editing=()=>document.activeElement&&document.activeElement.tagName==='TEXTAREA';
function payload(id){const s=state[id]||{};return {added:!!s.added,tested:!!s.tested,notes:s.notes||''}}
async function saveNote(id,v,sv){
  state[id]={...(state[id]||{}),notes:v};
  if(pending[id])return pending[id].then(()=>saveNote(id,state[id].notes,sv));
  pending[id]=db.doc('updates/'+id).set(payload(id)).then(()=>{sv.textContent='Saved';setTimeout(()=>{if(sv.textContent==='Saved')sv.textContent=''},1500)}).catch(e=>{sv.textContent='';$('status').textContent='Couldn\'t save that note ('+(e&&e.code||'error')+'). Reload and try again.'}).finally(()=>{delete pending[id]});
}
async function save(id,k,v){
  state[id]={...(state[id]||{}),[k]:v};render();
  if(pending[id])return pending[id].then(()=>save(id,k,state[id][k]));
  pending[id]=db.doc('updates/'+id).set(payload(id)).catch(e=>{$('status').textContent='Couldn\'t save that tick ('+(e&&e.code||'error')+'). Reload and try again.'}).finally(()=>{delete pending[id]});
}
document.querySelectorAll('.filters button').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.f;document.querySelectorAll('.filters button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()}));
render();
(async()=>{
  const timer=setTimeout(()=>{$('status').textContent='Ticks are taking a while to load.'},10000);
  try{db=window.claude?await window.claude.use('db'):null}catch(e){db=null}
  if(!db){clearTimeout(timer);try{const r=await fetch('updates.json',{cache:'no-store'});if(r.ok){Object.assign(state,await r.json());$('status').textContent='Read-only copy: ticks and notes from updates.json.';render();return}}catch(e){}$('status').textContent='Sign in to claude.ai to tick and save. The list is still readable.';render();return}
  db.collection('updates').onSnapshot(snap=>{clearTimeout(timer);snap.docs.forEach(d=>{const v=d.data()||{};if(editing()&&document.activeElement.dataset.id===d.id){v.notes=(state[d.id]||{}).notes}state[d.id]=v});$('status').textContent='Ticks and notes save automatically and are shared with anyone you give this page to.';if(editing()){dirty=true}else render()},e=>{clearTimeout(timer);$('status').textContent='Couldn\'t load ticks ('+(e&&e.code||'error')+').'});
})();
</script>
